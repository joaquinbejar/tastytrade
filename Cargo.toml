[package]
name = "tastytrade"
version = "0.4.0"
edition = "2024"
# Verified rather than inferred: 1.88 builds, 1.87 fails with "let expressions
# in this position are unstable" — in this crate and inside dxlink, which
# declares the same floor, so it is not ours alone to lower.
rust-version = "1.88"
license = "MIT"
description = "Library for trading through tastytrade's API"
repository = "https://github.com/joaquinbejar/tastytrade"

include = [
    "benches/**/*",
    "src/**/*",
    # The tests `include_str!` these, so the package does not compile without
    # them.
    "Doc/frames/**/*.json",
    "Doc/transactions_listing.json",
    "Doc/trading_status.json",
    "Doc/margin_requirements.json",
    "Doc/margin_dry_run.json",
    "Doc/order_dry_run.json",
    "Doc/market_data_by_type.json",
    # Real certification responses, redacted. `tests/integration/captures.rs`
    # reads them, and they are the only fixtures here the venue actually sent.
    "Doc/captures/*.json",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*.png",
    "Docker/**/*.Dockerfile",
    "Docker/**/*.yml",
]

[dependencies]
derive_builder = { workspace = true }
reqwest = { workspace = true, features = ["json", "form"] }
rust_decimal = { workspace = true, features = [
    "serde-with-arbitrary-precision",
    "serde-with-float",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
flume = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
tokio = { workspace = true, features = ["full"] }
futures-util = { workspace = true }
erased-serde = { workspace = true }
dxlink = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenv = { workspace = true }
pretty-simple-display = { workspace = true }

[dev-dependencies]
serial_test = "4.0"


[[test]]
name = "tests"
path = "tests/integration/mod.rs"

[workspace]
members = [
    "examples/account-data",
    "examples/accounts-status",
    "examples/quote-streaming",
    "cli",
    "examples/miscellaneous",
    "examples/instruments",
    "examples/market-data",
    "examples/orders",
]

[workspace.dependencies]
tastytrade = { path = "." }
derive_builder = "0.20"
reqwest = { version = "0.13", features = ["json", "form"] }
rust_decimal = { version = "1.42", features = [
    "serde-with-arbitrary-precision",
    "serde-with-float",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
flume = "0.12"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio = { version = "1.53", features = ["full"] }
futures-util = "0.3"
erased-serde = "0.4"
dxlink = "0.3.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"
pretty-simple-display = "0.1"
